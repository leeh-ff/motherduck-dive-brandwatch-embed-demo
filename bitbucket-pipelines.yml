# Deploys to the Azure Web App on every push to main.
#
# Repository variables (Repository settings > Pipelines > Repository variables):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID      service principal for deploys
#   AZURE_CLIENT_SECRET                   its secret (mark as Secured)
#   AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME
#
# Only the app's runtime files are deployed; App Service installs
# requirements.txt itself (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
image: mcr.microsoft.com/azure-cli

pipelines:
  branches:
    main:
      - step:
          name: Deploy to Azure Web App
          deployment: production
          script:
            - python3 -m zipfile -c app.zip app.py motherduck_session.py index.html requirements.txt
            - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
            - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --src-path app.zip --type zip
