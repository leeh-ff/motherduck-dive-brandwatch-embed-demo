# Deploys main to the Azure Web App.
#
# Signs in to Azure with OpenID Connect (a federated credential on an Entra app
# registration), so there is no stored deploy secret. Setup: README, "Deploying to Azure".
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME
# The job is skipped until AZURE_WEBAPP_NAME is set.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for the Azure OIDC sign-in

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Package the app
        # Only the runtime files; App Service installs requirements.txt itself.
        run: python3 -m zipfile -c app.zip app.py motherduck_session.py index.html requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_WEBAPP_NAME }}"
          --src-path app.zip --type zip
